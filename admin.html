<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | The Divine Foods</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body data-theme="dark">
  <div class="admin-shell" id="admin-root">
    <div id="admin-login-view" class="admin-login-panel">
      <div class="admin-card">
        <div class="admin-section-title">
          <div>Admin Sign In</div>
        </div>
        <div class="admin-form">
          <label for="admin-email">Email</label>
          <input id="admin-email" type="email" autocomplete="username">
          <label for="admin-password">Password</label>
          <input id="admin-password" type="password" autocomplete="current-password">
          <button class="btn" id="admin-login-btn">Sign In</button>
          <div class="admin-message" id="admin-login-message"></div>
        </div>
      </div>
      <div class="admin-card" style="margin-top:16px; display:none;" id="admin-mfa-card">
        <div class="admin-section-title">
          <div>Two-Factor Authentication</div>
        </div>
        <div class="admin-form">
          <label for="admin-mfa-code">Authenticator code</label>
          <input id="admin-mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code">
          <button class="btn" id="admin-mfa-btn">Verify</button>
          <div class="admin-message" id="admin-mfa-message"></div>
        </div>
      </div>
    </div>
    <div id="admin-dashboard-view" style="display:none;">
      <div class="admin-header">
        <div>
          <h1 style="font-size:1.4rem;">Product Admin</h1>
          <div class="admin-message">Manage products, versions, and activity logs.</div>
        </div>
        <div class="admin-header-actions">
          <button class="btn" id="admin-import-btn">Import JSON</button>
          <input id="admin-import-file" type="file" accept="application/json" style="display:none;">
          <button class="btn" id="admin-export-btn">Export</button>
          <button class="btn" id="admin-logout-btn">Logout</button>
        </div>
      </div>
      <div class="admin-grid">
        <div class="admin-card">
            <div class="admin-section-title">
              <div>Products</div>
            </div>
          <div class="admin-toolbar">
            <input id="admin-search-input" type="search" placeholder="Search products">
            <button class="btn" id="admin-refresh-btn">Refresh</button>
          </div>
          <div class="admin-products-list" id="admin-products-list"></div>
        </div>
        <div class="admin-card">
          <div class="admin-section-title">
            <div>Details</div>
            <button class="btn" id="admin-new-btn">New</button>
          </div>
          <div class="admin-form" id="admin-form">
            <input type="hidden" id="admin-product-id">
            <label for="admin-name">Name</label>
            <input id="admin-name" type="text">
            <label for="admin-description">Description</label>
            <textarea id="admin-description"></textarea>
            <div class="form-row">
              <div>
                <label for="admin-price">Price (₹, integer)</label>
                <input id="admin-price" type="number" min="0">
              </div>
              <div>
                <label for="admin-inventory">Inventory</label>
                <input id="admin-inventory" type="number" min="0">
              </div>
            </div>
            <label for="admin-image-url">Image URL</label>
            <input id="admin-image-url" type="text">
            <div class="form-row">
              <div>
                <label for="admin-archived">Status</label>
                <select id="admin-archived">
                  <option value="0">Active</option>
                  <option value="1">Archived</option>
                </select>
              </div>
            </div>
            <div style="display:flex; gap:8px; margin-top:6px;">
              <button class="btn" id="admin-save-btn">Save</button>
              <button class="btn" id="admin-archive-btn">Archive</button>
            </div>
            <div class="admin-message" id="admin-form-message"></div>
          </div>
          <div style="margin-top:16px;">
            <div class="admin-section-title">
              <div>Preview</div>
            </div>
            <div class="admin-preview-card" id="admin-preview"></div>
          </div>
          <div style="margin-top:16px;">
            <div class="admin-section-title">
              <div>Recent Activity</div>
            </div>
            <div class="admin-log-list" id="admin-activity-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="admin-modal-backdrop" id="admin-modal-backdrop" style="display:none;">
    <div class="admin-modal">
      <div class="admin-modal-body" id="admin-modal-body"></div>
      <div class="admin-modal-actions">
        <button class="btn" id="admin-modal-confirm">Confirm</button>
        <button class="btn" id="admin-modal-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
